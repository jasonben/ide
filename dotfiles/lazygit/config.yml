disableStartupPopups: true
os:
  edit: 'nvim -u ~/.nvim/init.lua -- {{filename}}'
  editAtLine: 'nvim -u ~/.nvim/init.lua +{{line}} -- {{filename}}'
  editAtLineAndWait: 'nvim -u ~/.nvim/init.lua +{{line}} -- {{filename}}'
  openDirInEditor: 'nvim -u ~/.nvim/init.lua -- {{dir}}'
  editInTerminal: true

