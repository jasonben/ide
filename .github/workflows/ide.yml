name: build docker image and push to docker hub

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Supersede older runs of the same PR; never cancel builds of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: ShellCheck
        run: shellcheck dotfiles/host/bin/ide dotfiles/host/bin/*.sh scripts/*

  buildx:
    needs: lint
    runs-on: ubuntu-latest
    env:
      # Layer cache on Docker Hub. CI on main writes it; PRs and local
      # `rake build` read it (the repo is public, so no login is needed).
      CACHE_REF: ${{ vars.IDE_CACHE_REF || 'jasonben/ide:buildcache' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Available build platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Docker Hub login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PRs (including Renovate's) build both platforms but never push.
      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ vars.IDE_DOCKER_IMAGE }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}
