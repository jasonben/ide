name: build docker image and push to docker hub

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A newer run supersedes an older one for the same PR or branch, main
# included: only the latest push to main gets built and published.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: ShellCheck
        run: shellcheck dotfiles/host/bin/ide dotfiles/host/bin/*.sh scripts/*

  buildx:
    needs: lint
    # Renovate PRs only get lint automatically. Build one by hand with:
    #   gh workflow run ide.yml --ref renovate/<branch>
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    env:
      # Layer cache on Docker Hub. CI on main writes it; PRs and local
      # `rake build` read it (the repo is public, so no login is needed).
      CACHE_REF: ${{ vars.IDE_CACHE_REF || 'jasonben/ide:buildcache' }}
      # Only main publishes the image and cache. PR events never have this
      # ref, and manual runs on other branches build without pushing.
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: QEMU
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Available build platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Docker Hub login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Builds both platforms everywhere; pushes only from main.
      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ vars.IDE_DOCKER_IMAGE }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}
